server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: household-service

  # Local dev: the repo-root certs/ directory is symlinked into the working
  # directory as certs/ (ln -sfn ../../certs certs). In Docker the entrypoint
  # symlinks the /run/secrets mount into /config/certs. Spring's configtree
  # support silently drops files whose path contains "..", hence the symlink.
  config:
    import:
      - optional:configtree:certs/
      - optional:configtree:/run/secrets/

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:household_db}
    username: ${DB_USERNAME:household_user}
    password: ${DB_PASSWORD:household_dev}

  flyway:
    enabled: true
    locations: classpath:db/migration

identity:
  jwt:
    issuer: ${IDENTITY_JWT_ISSUER:identity-service}
    audience: ${IDENTITY_JWT_AUDIENCE:meterhub-api}

management:
  # Liveness and readiness are separate probe concerns (conventions §13):
  # liveness answers "is the process up" with no dependency checks, readiness
  # includes the database so orchestration can stop routing traffic when it
  # is unreachable. The aggregate /actuator/health is not web-exposed —
  # probes use the dedicated subpaths
  endpoints:
    web:
      exposure:
        include: health,prometheus  # Prometheus scrapes /actuator/prometheus (task 10.4)
  endpoint:
    health:
      show-details: never
  observations:
    http:
      server:
        requests:
          name: http.server.requests
  metrics:
    distribution:
      percentiles-histogram:
        # Publish histogram buckets for the http.server.requests timer so
        # Prometheus can compute latency quantiles (Grafana dashboard p95);
        # count/sum exist by default without this.
        http.server.requests: true
  tracing:
    # Distributed tracing (spec 2_distributed_tracing_spec.md §5.1): the
    # bridge turns actuator observations into spans. MVP volume keeps every
    # trace; export failures never fail a request (batched, fire-and-forget).
    sampling:
      probability: 1.0
    propagation:
      # W3C trace context; X-Correlation-ID handling stays with the
      # correlation filter and is deliberately untouched.
      produce: [w3c]
      consume: [w3c]
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger all-in-one on the Compose network (only the UI is
          # host-published, docs/ports.md). Boot 4 property namespace
          # (management.opentelemetry.tracing.export.otlp.endpoint).
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  # The starter also auto-enables OTLP *metrics* export (OtlpMeterRegistry),
  # which nothing consumes here (Prometheus already scrapes the actuator
  # endpoint) — disable to avoid export-failure warnings. Note the namespace:
  # the registry flag is management.otlp.metrics.export.enabled (a sibling of
  # management.opentelemetry, per OnMetricsExportEnabledCondition), NOT
  # management.opentelemetry.metrics.export.otlp.enabled.
  otlp:
    metrics:
      export:
        enabled: false
  health:
    db:
      enabled: true

logging:
  # Structured single-line format per conventions §14: timestamp, level,
  # service, requestId (the correlation ID from the MDC, set by
  # CorrelationIdFilter) and message. The correlation ID lets a request be
  # followed from the gateway's logs into this service's logs (conventions §9).
  # The %replace escapes double quotes in the message so the line stays valid JSON
  pattern:
    console: "{\"timestamp\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC}\",\"level\":\"%p\",\"service\":\"household-service\",\"requestId\":\"%X{correlationId:-}\",\"message\":\"%replace(%m){'\"':'\\\\\"'}%n\"}"
    level: "%5p [%X{correlationId:-}]"
