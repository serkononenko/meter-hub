server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: household-service

  # Local dev: the repo-root certs/ directory is symlinked into the working
  # directory as certs/ (ln -sfn ../../certs certs). In Docker the entrypoint
  # symlinks the /run/secrets mount into /config/certs. Spring's configtree
  # support silently drops files whose path contains "..", hence the symlink.
  config:
    import:
      - optional:configtree:certs/
      - optional:configtree:/run/secrets/

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:household_db}
    username: ${DB_USERNAME:household_user}
    password: ${DB_PASSWORD:household_dev}

  flyway:
    enabled: true
    locations: classpath:db/migration

identity:
  jwt:
    issuer: ${IDENTITY_JWT_ISSUER:identity-service}
    audience: ${IDENTITY_JWT_AUDIENCE:meterhub-api}

logging:
  # Structured single-line format per conventions §14: timestamp, level,
  # service, requestId (the correlation ID from the MDC, set by
  # CorrelationIdFilter) and message. The correlation ID lets a request be
  # followed from the gateway's logs into this service's logs (conventions §9).
  # The %replace escapes double quotes in the message so the line stays valid JSON
  pattern:
    console: "{\"timestamp\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC}\",\"level\":\"%p\",\"service\":\"household-service\",\"requestId\":\"%X{correlationId:-}\",\"message\":\"%replace(%m){'\"':'\\\\\"'}%n\"}"
    level: "%5p [%X{correlationId:-}]"
