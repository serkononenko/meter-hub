server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service

  config:
    import:
      # Local dev: the per-service `certs` symlink -> the shared repo-root certs/
      # dir (create with: ln -sfn ../../certs certs). A relative ../-style path is
      # not usable here: Spring's configtree silently drops every file whose path
      # contains a ".." element. Docker: secrets written as
      # /run/secrets/<property-name> by compose / the platform
      - "optional:configtree:certs/"
      - "optional:configtree:/run/secrets/"

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:identity_db}
    username: ${DB_USERNAME:identity_user}
    password: ${DB_PASSWORD:identity_dev}

  flyway:
    enabled: true
    locations: classpath:db/migration

identity:
  jwt:
    issuer: ${IDENTITY_JWT_ISSUER:identity-service}
    audience: ${IDENTITY_JWT_AUDIENCE:meterhub-api}
    access-token-ttl: ${IDENTITY_JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${IDENTITY_JWT_REFRESH_TOKEN_TTL:30d}

management:
  # Liveness and readiness are separate probe concerns (conventions §13):
  # liveness answers "is the process up" with no dependency checks, readiness
  # includes the database so orchestration can stop routing traffic when it
  # is unreachable. The aggregate /actuator/health is not web-exposed —
  # probes use the dedicated subpaths
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

logging:
  # Structured single-line format per conventions §14: timestamp, level,
  # service, requestId (the correlation ID from the MDC, set by
  # CorrelationIdFilter) and message. The correlation ID lets a request be
  # followed from the gateway's logs into this service's logs (conventions §9).
  # The %replace escapes double quotes in the message so the line stays valid JSON
  pattern:
    console: "{\"timestamp\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC}\",\"level\":\"%p\",\"service\":\"identity-service\",\"requestId\":\"%X{correlationId:-}\",\"message\":\"%replace(%m){'\"':'\\\\\"'}%n\"}"
    level: "%5p [%X{correlationId:-}]"
