server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service

  config:
    import:
      # Local dev: the per-service `certs` symlink -> the shared repo-root certs/
      # dir (create with: ln -sfn ../../certs certs). A relative ../-style path is
      # not usable here: Spring's configtree silently drops every file whose path
      # contains a ".." element. Docker: secrets written as
      # /run/secrets/<property-name> by compose / the platform
      - "optional:configtree:certs/"
      - "optional:configtree:/run/secrets/"

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:identity_db}
    username: ${DB_USERNAME:identity_user}
    password: ${DB_PASSWORD:identity_dev}

  flyway:
    enabled: true
    locations: classpath:db/migration

identity:
  jwt:
    issuer: ${IDENTITY_JWT_ISSUER:identity-service}
    audience: ${IDENTITY_JWT_AUDIENCE:meterhub-api}
    access-token-ttl: ${IDENTITY_JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${IDENTITY_JWT_REFRESH_TOKEN_TTL:30d}

logging:
  # Every log line carries the request's correlation ID from the MDC (set by
  # CorrelationIdFilter), so a request can be followed from the gateway's
  # logs into this service's logs (conventions §9)
  pattern:
    level: "%5p [%X{correlationId:-}]"
