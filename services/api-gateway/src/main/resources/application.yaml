server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  http:
    clients:
      # Timeouts for the gateway's downstream proxy calls (RestClient): fail
      # fast instead of tying up a servlet thread on a hung service.
      # connect-timeout: how long establishing the downstream connection may take
      # read-timeout: how long a downstream may stay silent mid-response
      connect-timeout: 2s
      read-timeout: 10s

  config:
    import:
      # Public key PEM arrives as a file. Local dev: the per-service `certs`
      # symlink -> the shared repo-root certs/ dir (create with:
      # ln -sfn ../../certs certs; a relative ../-style path is not usable here,
      # Spring's configtree silently drops files under ".." path elements).
      # Docker: /run/secrets/ (the private key is only mounted into identity)
      - "optional:configtree:certs/"
      - "optional:configtree:/run/secrets/"

  cloud:
    gateway:
      server:
        webmvc:
          # One route per service, keyed by the /api/<service-name> prefix the
          # web client addresses each service through. StripPrefix=2 drops the
          # /api and /<service-name> segments (the predicate above guarantees
          # they are exactly that) so services keep serving their contract
          # paths (/api/v1/...) unchanged. URIs are overridable per
          # environment: local defaults point at localhost, Docker Compose
          # sets the service DNS names.
          routes:
            - id: identity
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/identity-service/**
              filters:
                - StripPrefix=2
            - id: household
              uri: ${HOUSEHOLD_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/household-service/**
              filters:
                - StripPrefix=2
            - id: meter
              uri: ${METER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/meter-service/**
              filters:
                - StripPrefix=2
            - id: reading
              uri: ${READING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/reading-service/**
              filters:
                - StripPrefix=2

logging:
  # Structured single-line format per conventions §14: timestamp, level,
  # service, requestId (the correlation ID from the MDC), traceId/spanId
# (from the MDC via the micrometer-tracing bridge when a span is active)
# and message. Every
  # log line (access log included) carries the request's correlation ID, so a
  # request can be followed through the gateway's logs and into the services'
  # logs. The %replace escapes double quotes in the message so the line stays valid JSON
  pattern:
    console: "{\"timestamp\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC}\",\"level\":\"%p\",\"service\":\"api-gateway\",\"requestId\":\"%X{correlationId:-}\",\"traceId\":\"%X{traceId:-}\",\"spanId\":\"%X{spanId:-}\",\"message\":\"%replace(%m){'\"':'\\\\\"'}%n\"}"
    level: "%5p [%X{correlationId:-}]"

management:
  # Liveness and readiness are separate probe concerns (conventions §13).
  # The gateway owns no database or other dependency: both probes answer
  # from process state alone
  endpoints:
    web:
      exposure:
        # Prometheus scrapes /actuator/prometheus (task 10.4)
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  # HTTP request metrics: Micrometer's http.server.requests timer gives
  # request count, latency and (via the status tag) error counts in one
  # metric. http_meters are the default; the correlation-id tag is
  # deliberately not added — it would explode Prometheus cardinality
  observations:
    http:
      server:
        requests:
          name: http.server.requests
  metrics:
    distribution:
      percentiles-histogram:
        # Publish histogram buckets for the http.server.requests timer so
        # Prometheus can compute latency quantiles (Grafana dashboard p95);
        # count/sum exist by default without this.
        http.server.requests: true
  tracing:
    # Distributed tracing (spec 2_distributed_tracing_spec.md §5.1): the
    # bridge turns actuator observations into spans. MVP volume keeps every
    # trace; export failures never fail a request (batched, fire-and-forget).
    sampling:
      probability: 1.0
    propagation:
      # W3C trace context; X-Correlation-ID handling stays with the
      # correlation filter and is deliberately untouched.
      produce: [w3c]
      consume: [w3c]
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger all-in-one on the Compose network (only the UI is
          # host-published, docs/ports.md). Boot 4 property namespace
          # (management.opentelemetry.tracing.export.otlp.endpoint).
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  # The starter also auto-enables OTLP *metrics* export (OtlpMeterRegistry),
  # which nothing consumes here (Prometheus already scrapes the actuator
  # endpoint) — disable to avoid export-failure warnings. Note the namespace:
  # the registry flag is management.otlp.metrics.export.enabled (a sibling of
  # management.opentelemetry, per OnMetricsExportEnabledCondition), NOT
  # management.opentelemetry.metrics.export.otlp.enabled.
  otlp:
    metrics:
      export:
        enabled: false

identity:
  jwt:
    # Must match what the identity service signs tokens with
    issuer: ${IDENTITY_JWT_ISSUER:identity-service}
    audience: ${IDENTITY_JWT_AUDIENCE:meterhub-api}
