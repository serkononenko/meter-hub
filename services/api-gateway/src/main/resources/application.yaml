server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway

  config:
    import:
      # Public key PEM arrives as a file: ./certs/ locally, /run/secrets/ in Docker
      - "optional:configtree:./certs/"
      - "optional:configtree:/run/secrets/"

  cloud:
    gateway:
      server:
        webmvc:
          # One route per API path prefix. URIs are overridable per environment:
          # local defaults point at localhost, Docker Compose sets the service DNS names.
          routes:
            - id: auth
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: users
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/**
            - id: households
              uri: ${HOUSEHOLD_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/households/**
            - id: meters
              uri: ${METER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/meters/**
            - id: readings
              uri: ${READING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/readings/**

identity:
  jwt:
    # Must match what the identity service signs tokens with
    issuer: ${IDENTITY_JWT_ISSUER:identity-service}
    audience: ${IDENTITY_JWT_AUDIENCE:meterhub-api}
