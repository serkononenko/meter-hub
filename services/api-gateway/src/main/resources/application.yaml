server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          # One route per downstream service. URIs are overridable per environment:
          # local defaults point at localhost, Docker Compose sets the service DNS names.
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
