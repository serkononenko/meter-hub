# CI: every push/PR runs all five service test suites, then the full
# e2e journey against a real Docker Compose stack (nothing mocked).
#
# Layout mirrors the repo: one matrix job per stack (Spring / NestJS)
# for the unit suites, and one job that boots the whole platform with
# `docker compose up -d --build` and drives e2e/journey.e2e.test.mjs
# against the gateway — the same "docker compose up" acceptance run
# used for the MVP (docs/tasks/0_meter_hub_mvp_tasks.md, 11.2).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring-tests:
    name: Spring tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, identity-service, household-service]
    # identity/household integration tests connect to
    # jdbc:postgresql://${DB_HOST:localhost}:5432/... (Flyway migrations
    # run at context startup), exactly like local development where the
    # Compose postgres is published on 5432. The gateway owns no DB, but
    # an unused service container is harmless there.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: meterhub_admin
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meterhub_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25 # build.gradle.kts toolchain
          cache: gradle
      - name: Create test databases and users (dev-default passwords)
        # Mirrors infrastructure/postgres/init/01-create-databases.sh but
        # with the credentials the test configs default to (identity_dev /
        # household_dev). The service container publishes 5432 on the
        # runner, so the runner's own psql client reaches it on localhost
        # (docker-run client containers can't use host.docker.internal on
        # Linux runners — that is a Docker Desktop name; that approach
        # failed on the first attempt).
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "postgres://meterhub_admin:ci-postgres@localhost:5432/postgres" \
            -c "CREATE USER identity_user WITH PASSWORD 'identity_dev';" \
            -c "CREATE USER household_user WITH PASSWORD 'household_dev';" \
            -c "CREATE DATABASE identity_db OWNER identity_user;" \
            -c "CREATE DATABASE household_db OWNER household_user;"
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: ./gradlew test

  nestjs-tests:
    name: NestJS tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [meter-service, reading-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches local dev (README prerequisites)
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: npm test

  e2e-journey:
    name: e2e journey (Docker Compose)
    runs-on: ubuntu-latest
    needs: [spring-tests, nestjs-tests]
    # Write access only to post the failure-diagnostics commit comment.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate dev JWT keys
        # Same steps as README §Local Setup 3 — the keys are git-ignored;
        # CI generates a throwaway pair and links it where the services
        # and docker compose secrets expect it.
        #
        # chmod 644: compose mounts secrets with the source file's mode,
        # and the services read them as a non-root appuser. On a Linux
        # runner the 0600 that openssl produces is enforced (macOS
        # Docker Desktop file sharing ignores the bits, which is why
        # this only failed in CI — run #5's identity crash:
        # AccessDeniedException: /run/secrets/identity.jwt.private-key).
        # Throwaway keys on a public repo — no secrecy to preserve.
        run: |
          mkdir -p certs
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out certs/identity.jwt.private-key
          openssl pkey -in certs/identity.jwt.private-key -pubout \
            -out certs/identity.jwt.public-key
          chmod 644 certs/identity.jwt.private-key certs/identity.jwt.public-key
      - name: Create .env from example
        # Any values work locally (README §2); CI uses throwaway secrets.
        run: |
          sed 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres/' .env.example > .env
          sed -i 's/^IDENTITY_DB_PASSWORD=.*/IDENTITY_DB_PASSWORD=ci-identity/' .env
          sed -i 's/^HOUSEHOLD_DB_PASSWORD=.*/HOUSEHOLD_DB_PASSWORD=ci-household/' .env
          sed -i 's/^METER_DB_PASSWORD=.*/METER_DB_PASSWORD=ci-meter/' .env
          sed -i 's/^READING_DB_PASSWORD=.*/READING_DB_PASSWORD=ci-reading/' .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "gateway is up"; exit 0
            fi
            sleep 5
          done
          echo "gateway did not come up in time"; docker compose ps; docker compose logs --tail 50; exit 1
      - name: Wait for every service to be ready
        # Gateway health only reflects the gateway process; on a cold
        # runner the first journey request raced the services' own
        # warmup (register 500'd — third CI run's failure). The services
        # are internal-only, so readiness is polled from inside the
        # stack: the grafana container (busybox wget) shares the compose
        # network and resolves the service DNS names. (A docker-run
        # sidecar on the compose network failed: the runner's Docker
        # did not resolve compose service names for it — fourth run.)
        # Spring: /actuator/health/readiness (DB-backed). NestJS:
        # /health/ready (Prisma warmup included).
        run: |
          set -e
          check() {
            local name=$1 url=$2
            for i in $(seq 1 60); do
              if docker compose exec -T grafana wget -q -O /dev/null "$url"; then
                echo "$name is ready"; return 0
              fi
              sleep 5
            done
            echo "$name did not become ready in time"; return 1
          }
          check identity  "http://identity-service:8081/actuator/health/readiness"
          check household "http://household-service:8082/actuator/health/readiness"
          check meter     "http://meter-service:8083/health/ready"
          check reading   "http://reading-service:8084/health/ready"
      - name: Run the journey test
        run: node --test e2e/journey.e2e.test.mjs
      - name: Container logs on failure
        if: failure()
        run: docker compose ps; docker compose logs --tail 100
      - name: Publish diagnostics to a commit comment
        # Raw job logs need admin auth to read via the API; a commit
        # comment is publicly readable. This is how a failing e2e run
        # hands its `docker compose ps` + crash logs back to tooling
        # without repository access.
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            let logs;
            try {
              logs = execSync(
                'docker compose ps && echo "=== logs ===" && docker compose logs --tail 60',
                { encoding: 'utf8' }
              ).slice(0, 60000);
            } catch (e) { logs = 'failed to collect: ' + e.message; }
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: [
                `## e2e journey failure (${process.env.GITHUB_RUN_ID})`,
                '```',
                logs,
                '```',
              ].join('\n'),
            });
