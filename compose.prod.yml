# Production-style deploy: run prebuilt images from ghcr.io instead of
# building on the target machine (see docs/deploy-portainer.md for the
# Portainer variant of this file). Use as an override over the base
# file:
#
#   docker compose -f docker-compose.yml -f compose.prod.yml pull
#   docker compose -f docker-compose.yml -f compose.prod.yml up -d
#
# Everything not listed here (postgres, loki, promtail, networks,
# secrets, volumes, env) is inherited from docker-compose.yml
# unchanged — this file swaps the six built images for their registry
# counterparts and locks the other published ports down. Tags track the
# branch CI publishes from (main).
#
# Port policy: `web` is the only interface reachable from other
# machines, published on host port 13000 (container port stays 3000).
# The browser never calls the gateway directly (Next.js rewrites /api/*
# server-side), so api-gateway's host port is removed.
# Observability UIs (prometheus, grafana, jaeger) and postgres keep
# their ports but bind to loopback only — use an SSH tunnel from your
# machine to reach them:
#
#   ssh -L 13000:localhost:13000 -L 13001:localhost:13001 \
#       -L 9090:localhost:9090 -L 16686:localhost:16686 \
#       -L 5432:localhost:5432 user@host
#
# (Prometheus and Jaeger have no auth; Grafana's admin password comes
# from .env — none of them should be LAN-exposed.)
#
# Requires Docker Compose v2.24+ for the `!reset null` tags (check
# with `docker compose version`).

services:
  api-gateway:
    image: ghcr.io/serkononenko/meter-hub-api-gateway:main
    build: !reset null
    ports: !reset null

  identity-service:
    image: ghcr.io/serkononenko/meter-hub-identity-service:main
    build: !reset null

  household-service:
    image: ghcr.io/serkononenko/meter-hub-household-service:main
    build: !reset null

  meter-service:
    image: ghcr.io/serkononenko/meter-hub-meter-service:main
    build: !reset null

  reading-service:
    image: ghcr.io/serkononenko/meter-hub-reading-service:main
    build: !reset null

  web:
    image: ghcr.io/serkononenko/meter-hub-web:main
    build: !reset null
    # Host 13000: 3000 is commonly taken by other UIs on home servers.
    # Container port stays 3000.
    ports: !override
      - "13000:3000"

  # Loopback-only: reachable from the host (and SSH tunnels), not the LAN.
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"

  # Host 13001, not 3001: 3001 is commonly taken by other UIs on home
  # servers (CasaOS-family backends bind it).
  grafana:
    ports: !override
      - "127.0.0.1:13001:3000"

  jaeger:
    ports: !override
      - "127.0.0.1:16686:16686"
