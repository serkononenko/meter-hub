# JWT contract values shared by the token producer (identity-service) and the
# token consumer (api-gateway) — they must stay in sync, so they are defined
# once here. Override in .env to change.
x-identity-jwt-env: &identity-jwt-env
  IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-identity-service}
  IDENTITY_JWT_AUDIENCE: ${IDENTITY_JWT_AUDIENCE:-meterhub-api}

services:
  postgres:
    image: postgres:17
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - meter-hub
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Single dev-grade broker, KRaft mode (no ZooKeeper). Two listeners:
  # kafka:9092 for the Compose network, localhost:9092 published for
  # host CLI inspection (kafka-console-consumer etc.) — advertised names
  # must match how each side resolves the broker.
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://kafka:9092,HOST://0.0.0.0:29092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: meter-hub-dev-cluster-0000000000001
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - meter-hub
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ./services/api-gateway
      additional_contexts:
        - contracts=./contracts
    environment:
      <<: *identity-jwt-env
      IDENTITY_SERVICE_URL: http://identity-service:8081
      HOUSEHOLD_SERVICE_URL: http://household-service:8082
      METER_SERVICE_URL: http://meter-service:8083
      READING_SERVICE_URL: http://reading-service:8084
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-60}
      RATE_LIMIT_REFILL_TOKENS: ${RATE_LIMIT_REFILL_TOKENS:-30}
      RATE_LIMIT_REFILL_PERIOD: ${RATE_LIMIT_REFILL_PERIOD:-1m}
      RATE_LIMIT_AUTH_CAPACITY: ${RATE_LIMIT_AUTH_CAPACITY:-10}
      RATE_LIMIT_AUTH_REFILL_TOKENS: ${RATE_LIMIT_AUTH_REFILL_TOKENS:-5}
      RATE_LIMIT_AUTH_REFILL_PERIOD: ${RATE_LIMIT_AUTH_REFILL_PERIOD:-1m}
    secrets:
      - identity.jwt.public-key
    ports:
      - "8080:8080"
    networks:
      - meter-hub
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      identity-service:
        condition: service_healthy
      household-service:
        condition: service_healthy
      meter-service:
        condition: service_healthy
      reading-service:
        condition: service_healthy

  identity-service:
    build:
      context: ./services/identity-service
      additional_contexts:
        - contracts=./contracts
    environment:
      <<: *identity-jwt-env
      DB_HOST: postgres
      DB_NAME: ${IDENTITY_DB}
      DB_USERNAME: ${IDENTITY_DB_USER}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    secrets:
      - identity.jwt.private-key
      - identity.jwt.public-key
    expose:
      - "8081"
    networks:
      - meter-hub
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/liveness" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  household-service:
    build:
      context: ./services/household-service
      additional_contexts:
        - contracts=./contracts
    environment:
      <<: *identity-jwt-env
      DB_HOST: postgres
      DB_NAME: ${HOUSEHOLD_DB}
      DB_USERNAME: ${HOUSEHOLD_DB_USER}
      DB_PASSWORD: ${HOUSEHOLD_DB_PASSWORD}
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    secrets:
      - identity.jwt.public-key
    expose:
      - "8082"
    networks:
      - meter-hub
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/liveness" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  meter-service:
    build:
      context: ./services/meter-service
    environment:
      <<: *identity-jwt-env
      DATABASE_URL: postgresql://${METER_DB_USER}:${METER_DB_PASSWORD}@postgres:5432/${METER_DB}
      IDENTITY_JWT_PUBLIC_KEY_PATH: /run/secrets/identity.jwt.public-key
      HOUSEHOLD_SERVICE_URL: http://household-service:8082
      OTEL_SERVICE_NAME: meter-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    secrets:
      - identity.jwt.public-key
    expose:
      - "8083"
    networks:
      - meter-hub
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8083/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      household-service:
        condition: service_started

  reading-service:
    build:
      context: ./services/reading-service
    environment:
      <<: *identity-jwt-env
      DATABASE_URL: postgresql://${READING_DB_USER}:${READING_DB_PASSWORD}@postgres:5432/${READING_DB}
      METER_SERVICE_URL: http://meter-service:8083
      HOUSEHOLD_SERVICE_URL: http://household-service:8082
      KAFKA_BROKERS: kafka:9092
      IDENTITY_JWT_PUBLIC_KEY_PATH: /run/secrets/identity.jwt.public-key
      OTEL_SERVICE_NAME: reading-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    secrets:
      - identity.jwt.public-key
    expose:
      - "8084"
    networks:
      - meter-hub
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8084/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      meter-service:
        condition: service_healthy

  # Demo Kafka consumer proving the async backbone (spec 5 §8): subscribes
  # to meter.reading.created, dedups on eventId in its own database. No
  # auth, no ports published — its only HTTP surface is health/metrics for
  # probes and Prometheus. Explicitly demo: Phase 3+ consumers replace it.
  events-demo:
    build:
      context: ./services/events-demo
    environment:
      DATABASE_URL: postgresql://${EVENTS_DEMO_DB_USER}:${EVENTS_DEMO_DB_PASSWORD}@postgres:5432/${EVENTS_DEMO_DB}
      KAFKA_BROKERS: kafka:9092
      OTEL_SERVICE_NAME: events-demo
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    expose:
      - "8085"
    networks:
      - meter-hub
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8085/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        GATEWAY_URL: http://api-gateway:8080
    environment:
      GATEWAY_URL: http://api-gateway:8080
    ports:
      - "3000:3000"
    networks:
      - meter-hub
    depends_on:
      api-gateway:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - meter-hub

  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - meter-hub
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - meter-hub

  loki:
    image: grafana/loki:3.5.7
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - meter-hub

  promtail:
    image: grafana/promtail:3.5.7
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infrastructure/loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - meter-hub

secrets:
  identity.jwt.private-key:
    file: ./certs/identity.jwt.private-key
  identity.jwt.public-key:
    file: ./certs/identity.jwt.public-key

volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  meter-hub:
    name: meter-hub-network
    driver: bridge