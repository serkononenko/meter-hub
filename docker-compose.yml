services:
  postgres:
    image: postgres:17
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - meter-hub
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  identity-service:
    image: meterhub/identity-service:latest
    environment:
      DB_HOST: postgres
      DB_NAME: ${IDENTITY_DB}
      DB_USERNAME: ${IDENTITY_DB_USER}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
    expose:
      - "8081"
    networks:
      - meter-hub
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  meter-hub:
    name: meter-hub-network
    driver: bridge