# JWT contract values shared by the token producer (identity-service) and the
# token consumer (api-gateway) — they must stay in sync, so they are defined
# once here. Override in .env to change.
x-identity-jwt-env: &identity-jwt-env
  IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-identity-service}
  IDENTITY_JWT_AUDIENCE: ${IDENTITY_JWT_AUDIENCE:-meterhub-api}

services:
  postgres:
    image: postgres:17
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - meter-hub
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    build:
      context: ./services/api-gateway
    environment:
      <<: *identity-jwt-env
      IDENTITY_SERVICE_URL: http://identity-service:8081
      HOUSEHOLD_SERVICE_URL: http://household-service:8082
      METER_SERVICE_URL: http://meter-service:8083
      READING_SERVICE_URL: http://reading-service:8084
    secrets:
      - identity.jwt.public-key
    ports:
      - "8080:8080"
    networks:
      - meter-hub
    depends_on:
      identity-service:
        condition: service_started
      household-service:
        condition: service_started
      meter-service:
        condition: service_started
      reading-service:
        condition: service_started

  identity-service:
    build:
      context: ./services/identity-service
      additional_contexts:
        - contracts=./contracts
    environment:
      <<: *identity-jwt-env
      DB_HOST: postgres
      DB_NAME: ${IDENTITY_DB}
      DB_USERNAME: ${IDENTITY_DB_USER}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
    secrets:
      - identity.jwt.private-key
      - identity.jwt.public-key
    expose:
      - "8081"
    networks:
      - meter-hub
    depends_on:
      postgres:
        condition: service_healthy

  household-service:
    build:
      context: ./services/household-service
      additional_contexts:
        - contracts=./contracts
    environment:
      <<: *identity-jwt-env
      DB_HOST: postgres
      DB_NAME: ${HOUSEHOLD_DB}
      DB_USERNAME: ${HOUSEHOLD_DB_USER}
      DB_PASSWORD: ${HOUSEHOLD_DB_PASSWORD}
    secrets:
      - identity.jwt.public-key
    expose:
      - "8082"
    networks:
      - meter-hub
    depends_on:
      postgres:
        condition: service_healthy

  meter-service:
    build:
      context: ./services/meter-service
    environment:
      <<: *identity-jwt-env
      # Prisma (client + migrate deploy) reads a single connection URL;
      # credentials flow from .env, never committed (conventions §12).
      DATABASE_URL: postgresql://${METER_DB_USER}:${METER_DB_PASSWORD}@postgres:5432/${METER_DB}
      # Where the Identity Service public key PEM lives (5.4 adds the
      # household-service base URL for ownership checks).
      IDENTITY_JWT_PUBLIC_KEY_PATH: /run/secrets/identity.jwt.public-key
      HOUSEHOLD_SERVICE_URL: http://household-service:8082
    secrets:
      - identity.jwt.public-key
    expose:
      - "8083"
    networks:
      - meter-hub
    depends_on:
      postgres:
        condition: service_healthy
      household-service:
        condition: service_started

  reading-service:
    build:
      context: ./services/reading-service
    environment:
      <<: *identity-jwt-env
      DATABASE_URL: postgresql://${READING_DB_USER}:${READING_DB_PASSWORD}@postgres:5432/${READING_DB}
      # Ownership checks call Meter Service's HTTP API (6.5); the token is
      # forwarded so Meter Service applies its own masking.
      METER_SERVICE_URL: http://meter-service:8083
      IDENTITY_JWT_PUBLIC_KEY_PATH: /run/secrets/identity.jwt.public-key
    secrets:
      - identity.jwt.public-key
    expose:
      - "8084"
    networks:
      - meter-hub
    depends_on:
      postgres:
        condition: service_healthy
      meter-service:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        GATEWAY_URL: http://api-gateway:8080
    environment:
      GATEWAY_URL: http://api-gateway:8080
    ports:
      - "3000:3000"
    networks:
      - meter-hub
    depends_on:
      api-gateway:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - meter-hub

  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - meter-hub
    depends_on:
      - prometheus

secrets:
  identity.jwt.private-key:
    file: ./certs/identity.jwt.private-key
  identity.jwt.public-key:
    file: ./certs/identity.jwt.public-key

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  meter-hub:
    name: meter-hub-network
    driver: bridge