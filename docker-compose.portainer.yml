# Production deployment as a Portainer stack (docs/deploy-portainer.md).
#
# Portainer stacks take ONE compose file, so this is standalone (not an
# override of docker-compose.yml). State lives in bind mounts under the
# repo checkout (REPO_DIR) instead of named volumes — easier to back up
# and inspect, at the cost of a one-time host fix: the data dirs must be
# owned by the containers' uids or writes fail (Grafana 472, Postgres
# 999, Prometheus 65534, Loki 10001), and `data/` is gitignored so
# runtime writes never dirty the checkout.
#
# Port policy: only web (WEB_PUBLIC_PORT, default 3000) and Grafana
# (13001, admin login from stack.env) are published. Everything else is
# internal-only.
#
# CERTS_DIR points at the host directory holding the two JWT PEM files
# (absolute path — Portainer resolves relative bind paths against its
# own data directory, not the host filesystem).

x-identity-jwt-env: &identity-jwt-env
  IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-identity-service}
  IDENTITY_JWT_AUDIENCE: ${IDENTITY_JWT_AUDIENCE:-meterhub-api}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The init script creates one DB/role per service from these.
      # They must be listed explicitly: stack env vars are available
      # for ${VAR} interpolation in this file but are NOT injected
      # into containers (unlike the dev compose, which uses env_file).
      IDENTITY_DB: ${IDENTITY_DB}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      HOUSEHOLD_DB: ${HOUSEHOLD_DB}
      HOUSEHOLD_DB_USER: ${HOUSEHOLD_DB_USER}
      HOUSEHOLD_DB_PASSWORD: ${HOUSEHOLD_DB_PASSWORD}
      METER_DB: ${METER_DB}
      METER_DB_USER: ${METER_DB_USER}
      METER_DB_PASSWORD: ${METER_DB_PASSWORD}
      READING_DB: ${READING_DB}
      READING_DB_USER: ${READING_DB_USER}
      READING_DB_PASSWORD: ${READING_DB_PASSWORD}
    volumes:
      - ${REPO_DIR:-/opt/meter-hub}/infrastructure/postgres/data:/var/lib/postgresql/data
      - ${REPO_DIR:-/opt/meter-hub}/infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    networks:
      - meter-hub
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    image: ghcr.io/serkononenko/meter-hub-api-gateway:main
    environment:
      <<: *identity-jwt-env
      IDENTITY_SERVICE_URL: http://identity-service:8081
      HOUSEHOLD_SERVICE_URL: http://household-service:8082
      METER_SERVICE_URL: http://meter-service:8083
      READING_SERVICE_URL: http://reading-service:8084
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      # The browser reaches the web client on the host's LAN address, so the
      # gateway must allow that origin (CORS is enforced at the gateway edge)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    secrets:
      - identity.jwt.public-key
    networks:
      - meter-hub
    depends_on:
      identity-service:
        condition: service_started
      household-service:
        condition: service_started
      meter-service:
        condition: service_started
      reading-service:
        condition: service_started

  identity-service:
    image: ghcr.io/serkononenko/meter-hub-identity-service:main
    environment:
      <<: *identity-jwt-env
      DB_HOST: postgres
      DB_NAME: ${IDENTITY_DB}
      DB_USERNAME: ${IDENTITY_DB_USER}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    secrets:
      - identity.jwt.private-key
      - identity.jwt.public-key
    expose:
      - "8081"
    networks:
      - meter-hub
    depends_on:
      postgres:
        condition: service_healthy

  household-service:
    image: ghcr.io/serkononenko/meter-hub-household-service:main
    environment:
      <<: *identity-jwt-env
      DB_HOST: postgres
      DB_NAME: ${HOUSEHOLD_DB}
      DB_USERNAME: ${HOUSEHOLD_DB_USER}
      DB_PASSWORD: ${HOUSEHOLD_DB_PASSWORD}
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    secrets:
      - identity.jwt.public-key
    expose:
      - "8082"
    networks:
      - meter-hub
    depends_on:
      postgres:
        condition: service_healthy

  meter-service:
    image: ghcr.io/serkononenko/meter-hub-meter-service:main
    environment:
      <<: *identity-jwt-env
      DATABASE_URL: postgresql://${METER_DB_USER}:${METER_DB_PASSWORD}@postgres:5432/${METER_DB}
      IDENTITY_JWT_PUBLIC_KEY_PATH: /run/secrets/identity.jwt.public-key
      HOUSEHOLD_SERVICE_URL: http://household-service:8082
      OTEL_SERVICE_NAME: meter-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    secrets:
      - identity.jwt.public-key
    expose:
      - "8083"
    networks:
      - meter-hub
    depends_on:
      postgres:
        condition: service_healthy
      household-service:
        condition: service_started

  reading-service:
    image: ghcr.io/serkononenko/meter-hub-reading-service:main
    environment:
      <<: *identity-jwt-env
      DATABASE_URL: postgresql://${READING_DB_USER}:${READING_DB_PASSWORD}@postgres:5432/${READING_DB}
      METER_SERVICE_URL: http://meter-service:8083
      IDENTITY_JWT_PUBLIC_KEY_PATH: /run/secrets/identity.jwt.public-key
      OTEL_SERVICE_NAME: reading-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    secrets:
      - identity.jwt.public-key
    expose:
      - "8084"
    networks:
      - meter-hub
    depends_on:
      postgres:
        condition: service_healthy
      meter-service:
        condition: service_started

  web:
    image: ghcr.io/serkononenko/meter-hub-web:main
    environment:
      GATEWAY_URL: http://api-gateway:8080
    ports:
      - "${WEB_PUBLIC_PORT:-3000}:3000"
    networks:
      - meter-hub
    depends_on:
      api-gateway:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ${REPO_DIR:-/opt/meter-hub}/infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${REPO_DIR:-/opt/meter-hub}/infrastructure/prometheus/data:/prometheus
    expose:
      - "9090"
    networks:
      - meter-hub

  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${REPO_DIR:-/opt/meter-hub}/infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${REPO_DIR:-/opt/meter-hub}/infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${REPO_DIR:-/opt/meter-hub}/infrastructure/grafana/data:/var/lib/grafana
    ports:
      - "13001:3000"
    networks:
      - meter-hub
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    expose:
      - "16686"
    networks:
      - meter-hub

  loki:
    image: grafana/loki:3.5.7
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ${REPO_DIR:-/opt/meter-hub}/infrastructure/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${REPO_DIR:-/opt/meter-hub}/infrastructure/loki/data:/loki
    expose:
      - "3100"
    networks:
      - meter-hub

  promtail:
    image: grafana/promtail:3.5.7
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ${REPO_DIR:-/opt/meter-hub}/infrastructure/loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - meter-hub

secrets:
  identity.jwt.private-key:
    file: ${CERTS_DIR}/identity.jwt.private-key
  identity.jwt.public-key:
    file: ${CERTS_DIR}/identity.jwt.public-key

networks:
  meter-hub:
    name: meter-hub-network
    driver: bridge
