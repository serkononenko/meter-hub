openapi: 3.0.3
info:
  title: MeterHub Reading Service API
  description: MeterHub Reading Service HTTP API. Covers meter reading registration and lookup for meters the authenticated user has access to.
  version: 1.1.0

tags:
  - name: Readings
    description: Meter reading endpoints

paths:
  /api/v1/readings:
    post:
      tags: [Readings]
      operationId: createReading
      summary: Record a reading for a meter the authenticated user can access
      description: >-
        Creates a reading under the given meter. The meter must exist and the
        caller must hold at least a MEMBER role in the meter's household
        (membership roles are owned by household-service); VIEWERs are
        rejected with 403 FORBIDDEN_ROLE, and non-members are not addressable,
        returning the same not-found problem as unknown meters. The source is
        always MANUAL in the MVP.
        Retried submissions should carry an `Idempotency-Key` header: within
        the retention window, a repeated key returns the original response
        instead of creating a second reading. Sending a key again with a
        different payload is a client error and returns 422
        IDEMPOTENCY_KEY_REUSED; a key that is still being processed answers
        409 IDEMPOTENCY_KEY_IN_USE with Retry-After (retry the same key).
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 16
            maxLength: 255
          description: >-
            Client-generated unique key for this submission (a UUID is a good
            choice). Repeated within the retention window (24 hours), the
            server replays the original response. Keys are scoped per user.
        - $ref: '../../openapi.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReadingRequest'
            example:
              meterId: 0d7f8a26-6f6f-4a55-9a71-3bd11c0a1f01
              value: 15432.1
              recordedAt: '2026-08-27T08:30:00Z'
      responses:
        '201':
          description: >
            Reading created — or, when a previously seen Idempotency-Key was
            presented, the original reading replayed.
          headers:
            X-Correlation-ID:
              $ref: '../../components/headers/correlation-id.yaml'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reading'
              example:
                id: 2b7e9a10-1c44-4c7e-8f5a-9d3b6c2e1a40
                meterId: 0d7f8a26-6f6f-4a55-9a71-3bd11c0a1f01
                value: 15432.1
                recordedAt: '2026-08-27T08:30:00Z'
                source: MANUAL
                createdAt: '2026-08-27T08:31:00Z'
        '400':
          $ref: '../../openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          description: The caller holds only a VIEWER role in the meter's household.
          headers:
            X-Correlation-ID:
              $ref: '../../components/headers/correlation-id.yaml'
          content:
            application/problem+json:
              schema:
                $ref: '../../openapi.yaml#/components/schemas/Problem'
              example:
                type: https://api.meterhub.local/problems/forbidden-role
                title: Forbidden for role
                status: 403
                code: FORBIDDEN_ROLE
                detail: The VIEWER role does not allow submitting readings.
                correlationId: 7d6f5f2c-0a49-4e10-8ef7-7c3d2b1f4a10
        '404':
          description: No meter with this identifier is visible to the authenticated user.
          headers:
            X-Correlation-ID:
              $ref: '../../components/headers/correlation-id.yaml'
          content:
            application/problem+json:
              schema:
                $ref: '../../openapi.yaml#/components/schemas/Problem'
              examples:
                meterNotFound:
                  summary: Meter does not exist or belongs to another user
                  value:
                    type: https://api.meterhub.local/problems/meter-not-found
                    title: Meter not found
                    status: 404
                    code: METER_NOT_FOUND
                    detail: No meter with this identifier is visible to the authenticated user.
                    correlationId: 7d6f5f2c-0a49-4e10-8ef7-7c3d2b1f4a10
        '422':
          description: The reading violates a business rule.
          headers:
            X-Correlation-ID:
              $ref: '../../components/headers/correlation-id.yaml'
          content:
            application/problem+json:
              schema:
                $ref: '../../openapi.yaml#/components/schemas/Problem'
              examples:
                readingDecreasing:
                  summary: Counter value lower than the previous reading
                  value:
                    type: https://api.meterhub.local/problems/reading-decreasing
                    title: Reading is lower than the previous one
                    status: 422
                    code: READING_DECREASING
                    detail: The value 100 is lower than the previous reading 15432.1 recorded at 2026-08-27T08:30:00Z. Cumulative meter counters must not decrease.
                    correlationId: 7d6f5f2c-0a49-4e10-8ef7-7c3d2b1f4a10
                recordedAtInFuture:
                  summary: Reading recorded in the future
                  value:
                    type: https://api.meterhub.local/problems/recorded-at-in-future
                    title: Reading timestamp is in the future
                    status: 422
                    code: RECORDED_AT_IN_FUTURE
                    detail: The recordedAt 2027-01-01T00:00:00Z is in the future; readings cannot be recorded ahead of time.
                    errors:
                      - field: recordedAt
                        message: must not be in the future
                    correlationId: 7d6f5f2c-0a49-4e10-8ef7-7c3d2b1f4a10
                recordedAtTooOld:
                  summary: Reading timestamp implausibly far in the past
                  value:
                    type: https://api.meterhub.local/problems/recorded-at-too-old
                    title: Reading timestamp is too far in the past
                    status: 422
                    code: RECORDED_AT_TOO_OLD
                    detail: The recordedAt 1994-05-01T00:00:00Z is more than 5 years in the past; the plausible window for utility readings is 5 years.
                    errors:
                      - field: recordedAt
                        message: must not be older than 5 years
                    correlationId: 7d6f5f2c-0a49-4e10-8ef7-7c3d2b1f4a10
        '409':
          description: >
            A request with this Idempotency-Key is still being processed
            (in-flight lock, backlog A5). Retryable: wait the Retry-After
            seconds, then send the same key again — the original response is
            replayed once the first attempt completes.
          headers:
            X-Correlation-ID:
              $ref: '../../components/headers/correlation-id.yaml'
            Retry-After:
              description: Seconds to wait before retrying the same key.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '../../openapi.yaml#/components/schemas/Problem'
              example:
                type: https://api.meterhub.local/problems/idempotency-key-in-use
                title: Idempotency key in use
                status: 409
                code: IDEMPOTENCY_KEY_IN_USE
                detail: A request with this idempotency key is still being processed.
                correlationId: 7d6f5f2c-0a49-4e10-8ef7-7c3d2b1f4a10
        '500':
          $ref: '../../openapi.yaml#/components/responses/InternalServerError'

  /api/v1/meters/{meterId}/readings:
    get:
      tags: [Readings]
      operationId: listReadings
      summary: List the reading history of a meter the authenticated user can access
      description: >-
        Returns the readings recorded under the given meter, newest first.
        The meter must exist and the caller must have any membership role in
        the meter's household; meters of households the caller is not a member
        of are not addressable and return the same not-found problem as
        unknown ones.
      security:
        - bearerAuth: []
      parameters:
        - name: meterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identifier of the meter whose readings to return.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: >-
            Page size. Values above 200 are capped server-side and the
            applied value is echoed in the response.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of readings to skip (newest-first ordering).
        - $ref: '../../openapi.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: >
            Page of the meter's readings, newest first. The echoed `limit`
            and `offset` reflect the server-applied values after clamping
            out-of-range or non-numeric input to the defaults.
          headers:
            X-Correlation-ID:
              $ref: '../../components/headers/correlation-id.yaml'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingPage'
              example:
                items:
                  - id: 2b7e9a10-1c44-4c7e-8f5a-9d3b6c2e1a40
                    meterId: 0d7f8a26-6f6f-4a55-9a71-3bd11c0a1f01
                    value: 15432.1
                    recordedAt: '2026-08-27T08:30:00Z'
                    source: MANUAL
                    createdAt: '2026-08-27T08:31:00Z'
                total: 137
                limit: 50
                offset: 0
        '400':
          $ref: '../../openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          description: No meter with this identifier is visible to the authenticated user.
          headers:
            X-Correlation-ID:
              $ref: '../../components/headers/correlation-id.yaml'
          content:
            application/problem+json:
              schema:
                $ref: '../../openapi.yaml#/components/schemas/Problem'
              examples:
                meterNotFound:
                  summary: Meter does not exist or belongs to another user
                  value:
                    type: https://api.meterhub.local/problems/meter-not-found
                    title: Meter not found
                    status: 404
                    code: METER_NOT_FOUND
                    detail: No meter with this identifier is visible to the authenticated user.
                    correlationId: 7d6f5f2c-0a49-4e10-8ef7-7c3d2b1f4a10
        '500':
          $ref: '../../openapi.yaml#/components/responses/InternalServerError'

  /api/v1/meters/{meterId}/readings/latest:
    get:
      tags: [Readings]
      operationId: getLatestReading
      summary: Return the most recent reading of a meter the authenticated user can access
      description: >-
        Returns the reading with the greatest recordedAt under the given
        meter. The meter must exist and the caller must have any membership
        role in the meter's household.
      security:
        - bearerAuth: []
      parameters:
        - name: meterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identifier of the meter whose latest reading to return.
        - $ref: '../../openapi.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The meter's most recent reading.
          headers:
            X-Correlation-ID:
              $ref: '../../components/headers/correlation-id.yaml'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reading'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '404':
          description: >
            No meter with this identifier is visible to the authenticated
            user, or the meter has no readings yet.
          headers:
            X-Correlation-ID:
              $ref: '../../components/headers/correlation-id.yaml'
          content:
            application/problem+json:
              schema:
                $ref: '../../openapi.yaml#/components/schemas/Problem'
              examples:
                readingNotFound:
                  summary: No readings recorded for this meter yet
                  value:
                    type: https://api.meterhub.local/problems/reading-not-found
                    title: Reading not found
                    status: 404
                    code: READING_NOT_FOUND
                    detail: The meter has no readings yet.
                    correlationId: 7d6f5f2c-0a49-4e10-8ef7-7c3d2b1f4a10
                meterNotFound:
                  summary: Meter does not exist or belongs to another user
                  value:
                    type: https://api.meterhub.local/problems/meter-not-found
                    title: Meter not found
                    status: 404
                    code: METER_NOT_FOUND
                    detail: No meter with this identifier is visible to the authenticated user.
                    correlationId: 7d6f5f2c-0a49-4e10-8ef7-7c3d2b1f4a10
        '500':
          $ref: '../../openapi.yaml#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by POST /api/v1/auth/login or /api/v1/auth/refresh.

  responses:
    UnauthorizedProblem:
      description: No access token was supplied, or it is invalid or expired.
      headers:
        X-Correlation-ID:
          $ref: '../../components/headers/correlation-id.yaml'
      content:
        application/problem+json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Problem'
          examples:
            missingToken:
              summary: No access token was supplied
              value:
                type: https://api.meterhub.local/problems/unauthorized
                title: Authentication required
                status: 401
                code: UNAUTHORIZED
                detail: A valid Bearer access token is required.
                correlationId: 7d6f5f2c-0a49-4e10-8ef7-7c3d2b1f4a10
            invalidToken:
              summary: The access token is invalid or expired
              value:
                type: https://api.meterhub.local/problems/invalid-token
                title: Invalid access token
                status: 401
                code: INVALID_TOKEN
                detail: The access token is invalid or expired.
                correlationId: 7d6f5f2c-0a49-4e10-8ef7-7c3d2b1f4a10

  schemas:
    ReadingSource:
      type: string
      enum: [MANUAL]
      description: How the reading entered the system. MVP records MANUAL entries only.

    CreateReadingRequest:
      type: object
      additionalProperties: false
      required: [meterId, value, recordedAt]
      properties:
        meterId:
          type: string
          format: uuid
          description: The meter the reading belongs to. Must be accessible to the authenticated user (any membership role in its household).
        value:
          type: number
          minimum: 0
          description: Meter counter value at recording time; non-negative (PRD §7).
        recordedAt:
          type: string
          format: date-time
          description: When the reading was taken. RFC 3339 timestamp in UTC. Must use the Z suffix.

    Reading:
      type: object
      additionalProperties: false
      required: [id, meterId, value, recordedAt, source, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: UUID v4 in canonical lowercase form.
          example: 2b7e9a10-1c44-4c7e-8f5a-9d3b6c2e1a40
        meterId:
          type: string
          format: uuid
          description: The meter this reading belongs to.
        value:
          type: number
          description: Meter counter value at recording time; non-negative (PRD §7).
        recordedAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC. Must use the Z suffix.
          example: '2026-08-27T08:30:00Z'
        source:
          $ref: '#/components/schemas/ReadingSource'
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC. Must use the Z suffix.
          example: '2026-08-27T08:30:00Z'

    ReadingPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      description: >-
        Offset-based page of readings with a total count. `limit` and
        `offset` echo the server-applied values after clamping, so clients
        can rely on them to build the next request.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
          description: The page of readings, newest first. Empty when the offset is past the end.
        total:
          type: integer
          minimum: 0
          description: Total number of readings for the meter, across all pages.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: Server-applied page size after clamping.
        offset:
          type: integer
          minimum: 0
          description: Server-applied number of skipped readings.
