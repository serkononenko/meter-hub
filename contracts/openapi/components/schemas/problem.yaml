type: object
required:
  - type
  - title
  - status
  - code
  - detail
  - correlationId
properties:
  type:
    type: string
    format: uri-reference
    description: URI identifying the problem type.
    example: https://api.meterhub.local/problems/validation-error
  title:
    type: string
    description: Short, human-readable summary of the problem type.
    example: Validation failed
  status:
    type: integer
    minimum: 100
    maximum: 599
    example: 400
  code:
    type: string
    description: Stable application-specific error code.
    example: VALIDATION_ERROR
  detail:
    type: string
    description: Human-readable explanation of this occurrence of the problem.
    example: One or more request fields are invalid.
  instance:
    type: string
    description: URI reference identifying the specific occurrence of the problem.
    example: /api/v1/meters
  correlationId:
    type: string
    format: uuid
    description: Correlation ID associated with the request.
    example: 7d6f5f2c-0a49-4e10-8ef7-7c3d2b1f4a10
  errors:
    type: array
    description: Optional field-level validation errors.
    items:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: serialNumber
        message:
          type: string
          example: must not be blank
additionalProperties: false
