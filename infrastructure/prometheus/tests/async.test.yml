rule_files:
  - ../rules/async.rules.yml

evaluation_interval: 1m

tests:
  - name: KafkaBrokerDown
    interval: 1m
    input_series:
      - series: 'kafka_brokers{job="kafka-exporter"}'
        values: '1x3 0x5 1x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: KafkaBrokerDown
        exp_alerts: []
      - eval_time: 7m
        alertname: KafkaBrokerDown
        exp_alerts:
          - exp_labels: {severity: critical, job: kafka-exporter}
            exp_annotations:
              summary: "Kafka has no brokers"
              description: "kafka-exporter reports no brokers for 2 minutes."
              dashboard: http://localhost:3001/d/meterhub-async-backbone
      - eval_time: 11m
        alertname: KafkaBrokerDown
        exp_alerts: []

  - name: ConsumerLagGrowing ignores draining lag
    interval: 1m
    input_series:
      - series: 'kafka_consumergroup_lag{consumergroup="events-demo", topic="meter.reading.created", partition="0"}'
        values: '150+10x25'
      - series: 'kafka_consumergroup_lag{consumergroup="draining", topic="t", partition="0"}'
        values: '400-10x25'
    alert_rule_test:
      - eval_time: 25m
        alertname: ConsumerLagGrowing
        exp_alerts:
          - exp_labels: {severity: warning, consumergroup: events-demo, topic: meter.reading.created}
            exp_annotations:
              summary: "events-demo is falling behind on meter.reading.created"
              description: "Lag is 400 messages and not decreasing."
              dashboard: http://localhost:3001/d/meterhub-async-backbone

  - name: OutboxBacklog fires above threshold for 5m
    interval: 1m
    input_series:
      - series: 'reading_outbox_unpublished{job="reading-service"}'
        values: '0x2 80x10'
      - series: 'provider_outbox_unpublished{job="provider-service"}'
        values: '3x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: OutboxBacklog
        exp_alerts: []
      - eval_time: 10m
        alertname: OutboxBacklog
        exp_alerts:
          - exp_labels: {severity: warning, job: reading-service}
            exp_annotations:
              summary: "reading-service: 80 outbox rows unpublished"
              description: "The outbox relay is not keeping up or is stuck."
              dashboard: http://localhost:3001/d/meterhub-async-backbone

  - name: OutboxPublishErrors fires while errors keep increasing
    interval: 1m
    input_series:
      - series: 'provider_outbox_publish_errors_total{job="provider-service"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: OutboxPublishErrors
        exp_alerts:
          - exp_labels: {severity: warning, job: provider-service}
            exp_annotations:
              summary: "provider-service: outbox publishing is failing"
              description: "Publish errors have been occurring for 5 minutes."
              dashboard: http://localhost:3001/d/meterhub-async-backbone

  - name: DeadLetteredMessages fires immediately and clears
    interval: 1m
    input_series:
      - series: 'consumer_dlq_messages_total{job="events-demo"}'
        values: '0x5 1x40'
    alert_rule_test:
      - eval_time: 3m
        alertname: DeadLetteredMessages
        exp_alerts: []
      - eval_time: 7m
        alertname: DeadLetteredMessages
        exp_alerts:
          - exp_labels: {severity: warning, job: events-demo}
            exp_annotations:
              summary: "events-demo dead-lettered 1 message(s)"
              description: "A message exhausted its retries or was malformed; inspect the DLQ topic."
              dashboard: http://localhost:3001/d/meterhub-async-backbone
      - eval_time: 30m
        alertname: DeadLetteredMessages
        exp_alerts: []
