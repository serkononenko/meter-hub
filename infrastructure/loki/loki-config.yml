# Loki single-binary config, dev-grade (companion to
# docs/spec/3_log_aggregation_spec.md). Filesystem storage with the TSDB
# schema — the current default — and 7d retention to match Prometheus.
# Multi-tenancy is disabled (auth_enabled: false): a local stack has a
# single tenant, same trust model as Jaeger all-in-one.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h # 7d, mirrors Prometheus

# Retention needs the compactor to actually delete expired data.
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem

# Ruler (spec 7): evaluates the LogQL rules under rules/fake (tenant "fake"
# is Loki's single-tenant ID when auth_enabled is false) and sends firing
# alerts to Alertmanager.
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  evaluation_interval: 1m
